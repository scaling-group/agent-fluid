schema_version = "dogfish.run_config.v1"

[free_swim]
L = 64
backend = "cuda"
Re = 1000.0
body_density = 1.0
added_mass_scale = 1.0
added_inertia_scale = 1.0
max_dimensionless_dt = 0.0055
gpu_monitor = false

[free_swim_multiwake_target_episode]
output_root = "logs/ppo_baseline"
horizon = 300.0
prewarm_horizon = 200.0
prewarm_with_fish = true
prewarm_only = false
wall_time_limit_s = 43200.0

domain_scale_x = 24.0
domain_scale_y = 16.0
initial_center_x_L = 21.0
initial_center_y_L = 14.0
initial_heading_deg = 29.0
target_x_L = 9.0
target_y_L = 9.5
success_radius_L = 0.75

cylinder_centers_x_L = [3.0, 3.0, 6.0, 6.0]
cylinder_centers_y_L = [8.5, 11.0, 7.25, 9.75]
cylinder_diameters_L = [0.65, 0.65, 0.65, 0.65]
collision_clearance_L = 0.0
domain_exit_margin_L = 0.8
cylinder_kick_amplitude_L = 0.0
cylinder_kick_start = 0.0
cylinder_kick_duration = 0.0
cylinder_kick_cycles = 1.0

flow_speed = 0.16
flow_perturbation = 0.001
flow_seed = 20260714
exit_bc = true

frame_count = 1
fps = 1
render_frames = false
plot_frames = false
vtk = false

actuation_mode = "policy"
initial_phi1_deg = 8.0
initial_phi2_deg = -8.0
phi_limit_deg = 45.0
phi_dot_limit_deg = 260.0
phi_ddot_limit_deg = 1800.0
observation_history_length = 8

dynamics_force_limit = 1.0e6
dynamics_speed_limit = 100.0
command_energy_weight = 0.0
power_proxy_weight = 0.0
unstable_dynamics_penalty = 2.0
station_success_bonus = 2.0
survival_bonus_weight = 0.2
final_distance_weight = 0.2
distance_integral_weight = 1.0

# The PBS launchers inject the fingerprint-matched production snapshot through
# DOGFISH_WAKE_LOAD_PREWARM_SNAPSHOT.
save_prewarm_snapshot = ""
load_prewarm_snapshot = ""
save_final_snapshot = false
final_snapshot_path = ""
load_episode_snapshot = ""
