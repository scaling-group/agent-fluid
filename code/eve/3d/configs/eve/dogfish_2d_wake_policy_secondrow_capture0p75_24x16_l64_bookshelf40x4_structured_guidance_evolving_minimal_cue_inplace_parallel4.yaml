# Fresh 40x4 minimal-cue structured-transfer Knowledge Bookshelf experiment.
# The seed supplies propulsion only; initial guidance does not name a missing
# mechanism or a task-solving observation.

defaults:
  - runtime: default
  - loop: default
  - driver: codex_max
  - logger: many_loggers
  - application: dogfish_2d_wake_policy_secondrow_capture0p75_24x16
  - optimizer: dogfish_2d_wake_policy_secondrow_capture0p75_24x16_bookshelf_structured_guidance_evolving_minimal_cue
  - evaluation: dogfish_2d_wake_policy_secondrow_capture0p75_24x16_inplace_parallel4
