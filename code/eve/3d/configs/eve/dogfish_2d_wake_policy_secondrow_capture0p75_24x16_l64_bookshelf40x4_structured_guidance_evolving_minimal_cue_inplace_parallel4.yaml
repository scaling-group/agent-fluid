label: dogfish-2d-wake-policy-secondrow-capture0p75-24x16-l64-bookshelf40x4-structured-guidance-evolving-minimal-cue-inplace-parallel4

loop:
  max_iterations: 40
  n_workers_phase2: 4
  n_parallel_phase2: 4
  n_solver_examples_phase2: 4
  n_optimizer_examples_phase2: 4
